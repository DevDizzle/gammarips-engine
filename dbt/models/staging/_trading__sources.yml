version: 2

sources:
  - name: profit_scout
    database: profitscout-fida8
    schema: profit_scout
    description: >
      Raw production tables written by the GammaRips Python Cloud Run pipeline.
      dbt reads these read-only; it never writes back here.

    # FRESHNESS THRESHOLDS. Every source here is written on a WEEKDAY cadence,
    # so the floor on any threshold is the weekend gap, not the write interval.
    # `warn_after` was 48h until 2026-08-10, which is BELOW that gap: the last
    # Friday write lands 16:30-17:40 ET, the digest reads Monday 07:15 ET, and
    # the age is 61-64h. Every weekday-cadence source therefore warned every
    # Monday while perfectly healthy (2026-08-10: ten of them at once), which
    # is how an operator learns to skim past the digest.
    # 72h clears the two-day gap with ~8h of margin. This is a READABILITY fix,
    # not a detection change: `warn_after` is NOT status-bearing anywhere. `dbt
    # source freshness` exits 0 on a warn, /freshness gates its 500 on rc alone,
    # and digest.py derives the section badge from rc — so on 2026-08-10 ten
    # WARNs still rendered as "Table freshness OK". At 48h a genuinely dead
    # writer was 1 of 13 identical Monday warns and had no discriminating power;
    # at 72h a warn is unusual enough to mean something.
    # `error_after` is deliberately UNCHANGED — it is the only status-bearing
    # boundary here, and a noise fix does not get to move it.
    # RESIDUAL, stated so it does not read as a regression when it happens: a
    # three-day weekend puts Tuesday's age near 86h, so a market-holiday Monday
    # still produces one warn on the Tuesday digest. That is ~6-9 mornings a
    # year rather than 52, and lifting the threshold past it would crowd
    # error_after. Cross-check a holiday-Tuesday warn against the coverage grid
    # before treating it as real.
    tables:
      - name: forward_paper_ledger
        description: >
          Terminal paper-trade records (3-day hold era + current). One row per
          signal after the hold closes — trade rows and skip rows
          (`is_skipped=true`). `realized_return_pct` is the OPTION premium return,
          the canonical PnL for this project (never the underlying).
        config:
          loaded_at_field: "CAST(exit_timestamp AS TIMESTAMP)"
          freshness:
            warn_after: {count: 72, period: hour}
            error_after: {count: 120, period: hour}
        tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns: [scan_date, ticker, recommended_contract]
        columns:
          - name: scan_date
            tests: [not_null]
          - name: ticker
            tests: [not_null]

      - name: forward_paper_ledger_intraday
        description: >
          Intraday end-of-day mark-to-market snapshots of open positions
          (V7 GIGO). One row per open position per trading day.
          `unrealized_return_pct` is the live option PnL of the open position.
        config:
          loaded_at_field: "CAST(snapshot_ts AS TIMESTAMP)"
          freshness:
            warn_after: {count: 72, period: hour}
            error_after: {count: 120, period: hour}
        tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns: [scan_date, snapshot_date, ticker]
        columns:
          - name: scan_date
            tests: [not_null]
          - name: snapshot_date
            tests: [not_null]

      - name: overnight_signals_enriched
        description: >
          Enriched + scored signal pool (the tournament candidate set). Scanner
          fields carried over plus technicals, news, risk, and premium scoring.
          NOTE: source has ~329 dup (scan_date, ticker) pairs from re-enrichment
          runs — uniqueness is WARN; staging dedups to latest by enriched_at.
        config:
          loaded_at_field: enriched_at
          freshness:
            warn_after: {count: 72, period: hour}
            error_after: {count: 120, period: hour}
        tests:
          - dbt_utils.unique_combination_of_columns:
              config:
                severity: warn
              arguments:
                combination_of_columns: [scan_date, ticker]
        columns:
          - name: scan_date
            tests: [not_null]
          - name: ticker
            tests: [not_null]

      - name: overnight_signals
        description: >
          Raw overnight scan output (pre-enrichment). NOTE: source appends
          re-scans (~1940 dup (scan_date, ticker) pairs) — uniqueness is WARN;
          staging dedups to latest by scan_timestamp.
        config:
          loaded_at_field: scan_timestamp
          freshness:
            warn_after: {count: 72, period: hour}
            error_after: {count: 120, period: hour}
        tests:
          - dbt_utils.unique_combination_of_columns:
              config:
                severity: warn
              arguments:
                combination_of_columns: [scan_date, ticker]
        columns:
          - name: scan_date
            tests: [not_null]
          - name: ticker
            tests: [not_null]

      - name: pool_liquidity_snapshot
        description: >
          Interval liquidity re-read of the current enriched pool (~50
          contracts), one row per (contract, as_of), written every ~10 min
          during RTH by signal-notifier/pool_liquidity.py. TELEMETRY — never a
          feature; entry-day-live tape keyed by explicit as_of. bid/ask/mid/
          spread_pct are NULL placeholders pending RM-001b.
        config:
          # Freshness ADDED 2026-08-07. This source was declared "minimally (no
          # freshness)", which left it in a blind spot between the two checks:
          # the digest's coverage grid cannot flag a table that has NO data in
          # its window (there is no newer data to make a hole a hole), and
          # freshness never looked at all. If the ~41-snaps/day writer died, both
          # checks would have read OK indefinitely.
          loaded_at_field: "CAST(as_of AS TIMESTAMP)"
          freshness:
            warn_after: {count: 72, period: hour}
            error_after: {count: 120, period: hour}
        columns:
          - name: scan_date
            tests: [not_null]
          - name: contract
            tests: [not_null]
          - name: as_of
            tests: [not_null]

      # ---- Outcomes / research domain (Phase 2) ----

      - name: enriched_option_outcomes
        description: >
          Counterfactual bracket-replay option-PnL labels over the FULL enriched
          pool (every candidate we *could* have traded), so a leakage-safe label
          set accrues ~50x faster than the 1-pick/day ledger. Partitioned by
          entry_day, clustered by ticker. `realized_return_pct` is the option PnL.
          NOTE: known data-quality issues (≈145 duplicate rows, uneven daily
          counts pre-Jun11) — the uniqueness test below is WARN, not error.
        config:
          loaded_at_field: labeled_at
          freshness:
            warn_after: {count: 72, period: hour}
            error_after: {count: 120, period: hour}
        tests:
          - dbt_utils.unique_combination_of_columns:
              config:
                severity: warn
              arguments:
                combination_of_columns: [scan_date, ticker, recommended_contract]
        columns:
          - name: scan_date
            tests: [not_null]
          - name: entry_day
            tests: [not_null]
          - name: ticker
            tests: [not_null]

      - name: signal_performance
        description: >
          Post-trade underlying-outcome tracking (win-tracker). Underlying-price
          based, NOT option PnL — kept for context only. Has historical column
          drift across writer eras; staging is intentionally lossless `select *`.
        config:
          # `performance_updated` does NOT exist on this table (it lives on
          # overnight_signals_enriched) — the check hard-errored with
          # "Unrecognized name: performance_updated" on every run from the
          # canary's creation (2026-07-28) to 2026-08-07, so this source had
          # ZERO freshness coverage while appearing to be covered.
          # This table carries no load timestamp at all; `check_date` (the date
          # win-tracker last re-checked the signal) is the only recency signal.
          # It is DATE-granular, so thresholds must absorb both the missing
          # intraday component and a weekend: Friday's write reads ~83h old at
          # Monday 07:00 ET, ~107h after a Monday holiday. Hence warn at 120h.
          # SAFE.PARSE_DATE, not PARSE_DATE: dbt runs max(<expr>) over the WHOLE
          # unfiltered table, and this one has documented writer-era column
          # drift. One legacy row with '' or an ISO datetime would make a bare
          # PARSE_DATE raise -> rc=1 -> a canary permanently red for a reason
          # that has nothing to do with freshness. That is the bug this change
          # fixes, with the polarity flipped. (Verified 0 unparseable of 6,395
          # rows on 2026-08-07 — SAFE is defence against the next writer, and a
          # NULL from SAFE is simply ignored by max().)
          loaded_at_field: "CAST(SAFE.PARSE_DATE('%Y-%m-%d', check_date) AS TIMESTAMP)"
          freshness:
            warn_after: {count: 120, period: hour}
            error_after: {count: 168, period: hour}
        tests:
          - dbt_utils.unique_combination_of_columns:
              config:
                severity: warn
              arguments:
                combination_of_columns: [scan_date, ticker]
        columns:
          - name: scan_date
            tests: [not_null]
          - name: ticker
            tests: [not_null]

      - name: paper_shadow_topscore
        description: >
          Isolated research shadow: Tournament pick vs deterministic top-score
          pick (one row per arm per day; arm in {TOURNAMENT, TOP_SCORE}).
          Walled off from Scorecard/website.
        config:
          loaded_at_field: created_at
          freshness:
            warn_after: {count: 72, period: hour}
            error_after: {count: 168, period: hour}
        tests:
          - dbt_utils.unique_combination_of_columns:
              config:
                severity: warn
              arguments:
                combination_of_columns: [scan_date, arm]
        columns:
          - name: scan_date
            tests: [not_null]
          - name: entry_day
            tests: [not_null]
          - name: arm
            tests: [not_null]

      - name: paper_shadow_intraday
        description: >
          Isolated research shadow: intraday-hold vs 3-day-hold for both the
          Tournament and top-score picks (completes the 2x2). One row per arm
          per day; arm in {TOURNAMENT, TOP_SCORE}.
        config:
          loaded_at_field: created_at
          freshness:
            warn_after: {count: 72, period: hour}
            error_after: {count: 168, period: hour}
        tests:
          - dbt_utils.unique_combination_of_columns:
              config:
                severity: warn
              arguments:
                combination_of_columns: [scan_date, arm]
        columns:
          - name: scan_date
            tests: [not_null]
          - name: entry_day
            tests: [not_null]
          - name: arm
            tests: [not_null]

      # ---- Eval / LLM-observability domain (Phase 3) ----

      - name: llm_traces_v1
        description: >
          One row per LLM call across all instrumented services (trace logger).
          Carries tokens, cost, latency, status/error. Partitioned by scan_date,
          clustered by (service, model_id). Grain = trace_id.
        config:
          loaded_at_field: created_at
          freshness:
            warn_after: {count: 72, period: hour}
            error_after: {count: 168, period: hour}
        tests:
          - dbt_utils.unique_combination_of_columns:
              config:
                severity: warn
              arguments:
                combination_of_columns: [trace_id]
        columns:
          - name: trace_id
            tests: [not_null]
          - name: service
            tests: [not_null]
          - name: model_id
            tests: [not_null]
          - name: scan_date
            tests: [not_null]
          - name: status
            tests: [not_null]

      - name: llm_eval_results_v1
        description: >
          One row per (trace, evaluator) eval result (gammarips-eval). Carries
          score / passed / judge_model. Partitioned by scan_date, clustered by
          (service, evaluator). Grain = eval_id.
        config:
          loaded_at_field: created_at
          freshness:
            warn_after: {count: 72, period: hour}
            error_after: {count: 168, period: hour}
        tests:
          - dbt_utils.unique_combination_of_columns:
              config:
                severity: warn
              arguments:
                combination_of_columns: [eval_id]
        columns:
          - name: eval_id
            tests: [not_null]
          - name: trace_id
            tests: [not_null]
          - name: evaluator
            tests: [not_null]
          - name: scan_date
            tests: [not_null]

      # ---- Vendor-data caches (added 2026-08-07) ----------------------------
      # These three feed the substrate but were NOT registered as dbt sources,
      # so nothing watched them. underlying_daily_bars silently went 37 days
      # stale (2026-07-01 -> 2026-08-07), which froze the public full-life
      # surface at 1,495 contracts. Freshness-only declarations: no staging
      # model reads them yet, the point is that the canary now sees them.
      # See docs/DECISIONS/2026-08-07-freshness-canary-and-bars-loader.md.

      - name: underlying_daily_bars
        description: >
          Polygon grouped-daily ADJUSTED closes for substrate tickers — the
          settlement-mark cache `/label_life_surface` reads to resolve each
          expired contract's hold-to-expiration intrinsic value. A gap here does
          NOT fail loudly: the labeler stamps `life_status='PARTIAL_NO_EXPIRY'`
          and the contract silently drops out of the public `life_status='OK'`
          cohort. Loaded weekdays 17:05 ET by forward-paper-trader
          `/load_underlying_bars` (T-1 closed sessions, rolling 5-session window).
          NOT the source of the live mom_60 tilt — enrichment-trigger calls
          Polygon grouped-daily directly.
        config:
          loaded_at_field: loaded_at
          freshness:
            warn_after: {count: 72, period: hour}
            error_after: {count: 120, period: hour}
        columns:
          - name: date
            tests: [not_null]
          - name: ticker
            tests: [not_null]

      - name: option_minute_paths
        description: >
          Per-contract minute bars over the pool's hold window (Polygon), the
          substrate behind the opportunity/full-life excursion surfaces.
          Partitioned by entry_day, clustered by contract. Written weekdays
          17:40 ET by `option-minute-paths-refresh`.
        config:
          loaded_at_field: ingested_at
          freshness:
            warn_after: {count: 72, period: hour}
            error_after: {count: 120, period: hour}
        columns:
          - name: entry_day
            tests: [not_null]
          - name: contract
            tests: [not_null]

      - name: polygon_iv_history
        description: >
          Daily ATM 30d implied-vol cache per ticker (Polygon), written weekdays
          16:30 ET by forward-paper-trader `/cache_iv`. Feeds the IV-rank /
          IV-percentile entry context. Partitioned by as_of_date, clustered by
          ticker.
        config:
          loaded_at_field: fetched_at
          freshness:
            warn_after: {count: 72, period: hour}
            error_after: {count: 120, period: hour}
        columns:
          - name: as_of_date
            tests: [not_null]
          - name: ticker
            tests: [not_null]
